<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📸 批量截图小工具</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        background: linear-gradient(
          135deg,
          #fff5f7 0%,
          #fef3f8 50%,
          #f0f4ff 100%
        );
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
      }

      /* 背景装饰小元素 */
      body::before,
      body::after {
        content: "🌸";
        position: fixed;
        font-size: 24px;
        opacity: 0.4;
        pointer-events: none;
      }
      body::before {
        top: 10%;
        left: 8%;
      }
      body::after {
        bottom: 15%;
        right: 10%;
        content: "✨";
      }

      .container {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        padding: 48px 40px;
        box-shadow:
          0 20px 60px rgba(255, 182, 193, 0.2),
          0 8px 24px rgba(0, 0, 0, 0.04);
        max-width: 520px;
        width: 100%;
        text-align: center;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      /* 顶部小装饰 */
      .container::before {
        content: "💖";
        position: absolute;
        top: -18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 28px;
      }

      h1 {
        color: #5a4a6b;
        margin-top: 10px;
        margin-bottom: 8px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .subtitle {
        color: #9a8aaa;
        font-size: 14px;
        margin-bottom: 32px;
      }

      .file-input-wrapper {
        margin: 30px 0;
        padding: 40px 30px;
        border: 2px dashed #ffb6c1;
        border-radius: 16px;
        background: linear-gradient(135deg, #fff9fb 0%, #fff5f8 100%);
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
      }

      .file-input-wrapper:hover {
        background: linear-gradient(135deg, #fff0f5 0%, #ffeaf2 100%);
        border-color: #ff9eb5;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 182, 193, 0.25);
      }

      .file-input-wrapper input {
        display: none;
      }

      .file-input-wrapper p {
        margin: 0;
        color: #b88fa0;
        font-size: 15px;
      }

      .file-icon {
        font-size: 36px;
        margin-bottom: 12px;
        display: block;
      }

      button {
        background: linear-gradient(135deg, #ffb6c1 0%, #ff9eb5 100%);
        color: white;
        border: none;
        border-radius: 50px;
        padding: 14px 48px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 6px 20px rgba(255, 158, 181, 0.4);
        letter-spacing: 1px;
      }

      button:hover:not(:disabled) {
        background: linear-gradient(135deg, #ff9eb5 0%, #ff85a2 100%);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(255, 133, 162, 0.5);
      }

      button:active:not(:disabled) {
        transform: translateY(0);
      }

      button:disabled {
        background: linear-gradient(135deg, #d8d0d4 0%, #c8c0c4 100%);
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      #status {
        margin-top: 24px;
        font-weight: 500;
        min-height: 30px;
        color: #7a6a8a;
        font-size: 14px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(255, 245, 248, 0.6);
      }

      #downloadLinks {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      #downloadLinks a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 22px;
        background: linear-gradient(135deg, #b8e0d2 0%, #95d5b2 100%);
        color: white;
        text-decoration: none;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s ease;
        box-shadow: 0 4px 14px rgba(149, 213, 178, 0.35);
      }

      #downloadLinks a:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(149, 213, 178, 0.45);
      }

      #downloadLinks a:nth-child(2) {
        background: linear-gradient(135deg, #c8b6ff 0%, #b8a0ff 100%);
        box-shadow: 0 4px 14px rgba(184, 160, 255, 0.35);
      }

      #downloadLinks a:nth-child(2):hover {
        box-shadow: 0 6px 18px rgba(184, 160, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📸 美志批量截图小工具</h1>
      <p class="subtitle">上传 Excel，一键生成美志截图～ 🌸</p>

      <form id="uploadForm" enctype="multipart/form-data">
        <div class="file-input-wrapper" id="fileDropArea">
          <span class="file-icon">📂</span>
          <p>点击选择文件或拖拽 Excel 到这里</p>
          <input
            type="file"
            name="excel"
            id="fileInput"
            accept=".xlsx,.xls"
            required
          />
        </div>
        <button type="submit" id="submitBtn">✨ 开始处理</button>
      </form>

      <div id="status"></div>
      <div id="downloadLinks"></div>
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");
      const dropArea = document.getElementById("fileDropArea");
      const submitBtn = document.getElementById("submitBtn");
      const statusDiv = document.getElementById("status");
      const downloadDiv = document.getElementById("downloadLinks");

      // 点击区域触发文件选择
      dropArea.addEventListener("click", () => fileInput.click());

      // 拖拽支持
      dropArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropArea.style.borderColor = "#ff85a2";
        dropArea.style.background =
          "linear-gradient(135deg, #fff0f5 0%, #ffe0eb 100%)";
      });

      dropArea.addEventListener("dragleave", () => {
        dropArea.style.borderColor = "#ffb6c1";
        dropArea.style.background =
          "linear-gradient(135deg, #fff9fb 0%, #fff5f8 100%)";
      });

      dropArea.addEventListener("drop", (e) => {
        e.preventDefault();
        dropArea.style.borderColor = "#ffb6c1";
        dropArea.style.background =
          "linear-gradient(135deg, #fff9fb 0%, #fff5f8 100%)";
        if (e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          updateFileName();
        }
      });

      fileInput.addEventListener("change", () => {
        updateFileName();
      });

      function updateFileName() {
        if (fileInput.files.length) {
          const label = dropArea.querySelector("p");
          label.textContent = "✅ " + fileInput.files[0].name;
        }
      }

      document
        .getElementById("uploadForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!fileInput.files.length) {
            alert("请先选择文件哦～");
            return;
          }

          const formData = new FormData();
          formData.append("excel", fileInput.files[0]);

          submitBtn.disabled = true;
          submitBtn.textContent = "处理中...";
          statusDiv.textContent =
            "⏳ 正在努力截图中，可能需要几分钟，请耐心等待哦～";
          downloadDiv.innerHTML = "";

          try {
            const response = await fetch("/upload", {
              method: "POST",
              body: formData,
            });

            if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.error || "处理失败");
            }

            const data = await response.json();
            statusDiv.textContent = `🎉 处理完成！成功 ${data.successCount} 条，失败 ${data.failedCount} 条。`;

            let linksHtml = "";
            if (data.resultExcel) {
              linksHtml += `<a href="${data.resultExcel}" download>📥 下载结果 Excel</a>`;
            }
            if (data.failedExcel) {
              linksHtml += `<a href="${data.failedExcel}" download>📋 下载失败记录</a>`;
            }
            downloadDiv.innerHTML = linksHtml;
          } catch (err) {
            statusDiv.textContent = "😢 " + err.message;
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "✨ 开始处理";
          }
        });
    </script>
  </body>
</html>
